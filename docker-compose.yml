services:
  backend:
    build: ./backend
    ports:
      - "9090:9090"
    volumes:
      - ./backend/app:/app/app
      - backend-uploads:/app/uploads
      - backend-outputs:/app/outputs
      - backend-zips:/app/zips
      - backend-data:/app/data
    environment:
      HOST: 0.0.0.0
      PORT: "9090"
      CORS_ORIGINS: http://localhost:9000,http://127.0.0.1:9000
      LOG_LEVEL: INFO
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
    command: uvicorn app.main:app --host 0.0.0.0 --port 9090 --reload

  frontend:
    build: ./frontend
    ports:
      - "9000:9000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:9090
    command: npm run dev -- --host 0.0.0.0 --port 9000
    depends_on:
      - backend

volumes:
  backend-uploads:
  backend-outputs:
  backend-zips:
  backend-data:
